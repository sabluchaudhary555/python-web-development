<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Static Files Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static.css') }}">
</head>
<body>

    <h1>Flask Static Files Demo</h1>

    <!-- Image -->
    <h2>Image</h2>
    <img src="{{ url_for('static', filename='images/sample.jpg') }}" alt="Sample Image" class="demo-img">

    <!-- Video -->
    <h2>Video</h2>
    <video controls class="demo-video">
        <source src="{{ url_for('static', filename='videos/sample.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Audio -->
    <h2>Audio</h2>
    <audio controls class="demo-audio">
        <source src="{{ url_for('static', filename='audios/sample.mp3') }}" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
